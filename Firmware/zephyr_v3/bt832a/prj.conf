# bt832a: default preset. This is the complete configuration.
# Select nrf52dk/nrf52810 with NCS v3.3.1 and sysbuild.
# No EXTRA_CONF_FILE or other custom build arguments are needed.

CONFIG_GPIO=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_CMDS_RESIZE=n
CONFIG_REBOOT=y
CONFIG_SERIAL=n
# Modules do not require an external 32.768 kHz crystal for bring-up.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n

# Historical nrf52832A directory actually selected nRF52810 (192K/24K).
CONFIG_BIO_PROFILE="BT832A / nRF52810 legacy"
CONFIG_BT_DEVICE_NAME="BT832A-v3"
CONFIG_SHELL=n
CONFIG_SHELL_BACKEND_RTT=n
CONFIG_BIO_TX_DEPTH=2
CONFIG_BIO_COMMAND_DEPTH=2
CONFIG_BIO_REPLY_DEPTH=1
CONFIG_BIO_ADS_STACK=1024
CONFIG_BT_RX_STACK_SIZE=1024
CONFIG_MAIN_STACK_SIZE=1536
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536
CONFIG_BT_RECV_WORKQ_SYS=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=256
CONFIG_ISR_STACK_SIZE=1024
# Small ATT buffers: use the framed stream, not the 227-byte legacy notification.
CONFIG_BT_L2CAP_TX_MTU=64
CONFIG_BT_BUF_ACL_RX_SIZE=68
CONFIG_BT_BUF_ACL_TX_SIZE=68
CONFIG_BT_BUF_EVT_RX_COUNT=3
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=1
CONFIG_BT_BUF_ACL_TX_COUNT=1
CONFIG_BT_L2CAP_TX_BUF_COUNT=2
CONFIG_BT_L2CAP_TX_FRAG_COUNT=1
CONFIG_BT_ATT_TX_COUNT=1
CONFIG_BT_CTLR_SDC_TX_PACKET_COUNT=1
CONFIG_BT_CTLR_SDC_RX_PACKET_COUNT=1
CONFIG_HEAP_MEM_POOL_SIZE=512
CONFIG_SIZE_OPTIMIZATIONS=y
