# bt840: default preset. This is the complete configuration.
# Select nrf52840dk/nrf52840 with NCS v3.3.1 and sysbuild.
# No EXTRA_CONF_FILE or other custom build arguments are needed.

CONFIG_GPIO=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=3
CONFIG_BT_RX_STACK_SIZE=1536
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_CMDS_RESIZE=n
CONFIG_REBOOT=y
CONFIG_SERIAL=n
# Modules do not require an external 32.768 kHz crystal for bring-up.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n

CONFIG_BIO_PROFILE="BT52840 / BT840"
CONFIG_BT_DEVICE_NAME="BT840-v3"
CONFIG_BIO_I2C_SENSORS=y
CONFIG_BIO_BEACONS=y
